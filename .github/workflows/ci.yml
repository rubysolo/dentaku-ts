name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + lint + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'mise.toml' is the pinned dev Node (currently 24.22.0), so the
        # matrix always covers exactly what local dev and the build job use.
        node: ['22', 'mise.toml', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node != 'mise.toml' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'mise.toml' && 'mise.toml' || '' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
